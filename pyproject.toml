[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ju0-terminal-tower"
version = "0.3.1rc0"
description = "JTT, a local-first workspace for independent interactive PTY terminals."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pyte>=0.8.2,<0.9"]
authors = [{ name = "ju0o" }]
keywords = [
    "tmux",
    "ai-agent",
    "coding-agent",
    "codex",
    "claude-code",
    "opencode",
    "terminal",
    "tui",
    "developer-tools",
    "agent-monitor",
    "multi-agent",
    "cli",
]
classifiers = [
    "Environment :: Console :: Curses",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Tools",
    "Topic :: Terminals",
]

[project.urls]
Homepage = "https://github.com/ju0o/JTT"
Issues = "https://github.com/ju0o/JTT/issues"

[project.scripts]
jtt = "ju0_terminal_tower.bootstrap:main"

[tool.setuptools.package-data]
ju0_terminal_tower = ["resources/harnesses/*.md", "remote/*.js"]

[tool.setuptools.data-files]
"share/licenses/ju0-terminal-tower" = ["licenses/pyte-LGPL-3.0.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
