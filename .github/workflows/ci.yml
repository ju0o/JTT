name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[windows-ui-test]" pytest

      - name: Byte-compile (syntax check)
        run: python -m py_compile $(find src -name '*.py')

      - name: Run tests
        run: pytest -q

      - name: tower --doctor (best-effort, no tmux session in CI)
        run: tower --doctor || true

  candidate-gate:
    name: Linux candidate verification status
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report Draft state without calling it a test pass
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: python3 .github/scripts/ci_candidate_gate.py draft skipped "$PR_HEAD_SHA" "$CHECKOUT_SHA"

      - name: Require Linux matrix for main and review candidates
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: python3 .github/scripts/ci_candidate_gate.py candidate "$TEST_RESULT" "$PR_HEAD_SHA" "$CHECKOUT_SHA"
