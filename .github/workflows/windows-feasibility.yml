  windows-r02-input-comparison:
    name: Windows Draft - R02 Direct/Worker ${{ matrix.group }} comparison
    if: github.event.pull_request.draft == true
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group:
          - baseline
          - unicode
          - path
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated diagnostic dependencies
        run: |
          python -m pip install -r experiments/windows_native/requirements.txt
          python -m pip install --no-deps -e .
      - name: Record Windows Python and dependency versions
        run: |
          python --version
          python -m pip freeze
          python -c "import platform; print(platform.platform())"
      - name: Prepare test-owned comparison result directory
        run: New-Item -ItemType Directory -Force test-results | Out-Null
      - name: Run one Direct/Worker comparison group
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          R02_COMPARISON_GROUP: ${{ matrix.group }}
        run: >-
          python -m pytest --noconftest -p no:cacheprovider -q -s
          "tests/test_windows_terminal_backend.py::test_native_conpty_input_execution_path_comparison[${env:R02_COMPARISON_GROUP}]"
          "--junitxml=test-results/r02-input-comparison-${env:R02_COMPARISON_GROUP}.xml"
      - name: Preserve Direct/Worker comparison group result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-r02-input-comparison-${{ matrix.group }}-${{ github.run_id }}
          path: test-results/r02-input-comparison-${{ matrix.group }}.xml
          if-no-files-found: error

  windows-r02-input-comparison-summary:
    name: Windows Draft - R02 comparison evidence coverage
    if: always() && github.event.pull_request.draft == true
    needs:
      - windows-r02-input-comparison
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download per-group JUnit artifacts
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: windows-r02-input-comparison-*-${{ github.run_id }}
          path: group-results
          merge-multiple: false
      - name: Require all group evidence and passing outcomes
        if: always()
        env:
          MATRIX_RESULT: ${{ needs.windows-r02-input-comparison.result }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          expected = {
              "baseline": ["baseline"],
              "unicode": [
                  "unicode_first", "ascii_then_unicode",
                  "ascii_then_unicode_per_key", "ascii_then_unicode_crlf",
                  "unicode_output_only",
              ],
              "path": [
                  "path_standalone_single_write",
                  "path_standalone_single_write_crlf",
                  "path_after_ascii_single_write",
                  "path_after_ascii_per_key",
              ],
          }
          errors = []
          if os.environ.get("MATRIX_RESULT") != "success":
              errors.append("matrix result is not success")
          if os.environ.get("DOWNLOAD_OUTCOME") != "success":
              errors.append("artifact download did not complete successfully")
          files = list(Path("group-results").glob("**/r02-input-comparison-*.xml"))
          if len(files) != len(expected):
              errors.append(f"expected 3 group JUnit files; found {len(files)}")
          seen = set()
          for path in files:
              group = path.stem.removeprefix("r02-input-comparison-")
              if group not in expected or group in seen:
                  errors.append(f"unexpected or duplicate group artifact: {path}")
                  continue
              seen.add(group)
              try:
                  root = ET.parse(path).getroot()
              except (OSError, ET.ParseError) as exc:
                  errors.append(f"{group}: invalid JUnit XML ({type(exc).__name__})")
                  continue
              cases = root.findall(".//testcase")
              if len(cases) != 1:
                  errors.append(f"{group}: expected one collected testcase; found {len(cases)}")
                  continue
              case = cases[0]
              if not case.attrib.get("name", "").endswith(f"[{group}]"):
                  errors.append(f"{group}: JUnit testcase name does not match group")
              properties = {
                  item.attrib.get("name"): item.attrib.get("value")
                  for item in case.findall("./properties/property")
              }
              if properties.get("comparison_group") != group:
                  errors.append(f"{group}: missing or mismatched group property")
              try:
                  scenarios = json.loads(properties.get("comparison_scenarios", "null"))
              except json.JSONDecodeError:
                  scenarios = None
              if scenarios != expected[group]:
                  errors.append(f"{group}: scenario coverage does not match contract")
              if any(case.find(tag) is not None for tag in ("failure", "error", "skipped")):
                  errors.append(f"{group}: JUnit reports failure, error, or skip")
          if seen != set(expected):
              errors.append(f"group coverage incomplete: {sorted(seen)}")
          if errors:
              for error in errors:
                  print(f"R02_COMPARISON_EVIDENCE_FAIL: {error}")
              sys.exit(1)
          print("R02_COMPARISON_EVIDENCE_COMPLETE: baseline, unicode, path")
          PY

  windows-r02-input-ab-direct:
