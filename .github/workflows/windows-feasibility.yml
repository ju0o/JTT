      - name: Run worker lifecycle and native Resize/Reconnect tests
        run: python -m pytest -q -s tests/test_windows_worker_threads.py tests/test_windows_terminal_backend.py::test_native_powershell_create_io_resize_detach_reconnect_stop --junitxml=test-results/worker-lifecycle.xml
