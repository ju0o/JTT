          New-Item -ItemType Directory -Force test-results | Out-Null
          if (Test-Path -LiteralPath 'test-results/r02-input-factor.xml') { throw 'R02 JUnit path already exists' }
          if (Test-Path -LiteralPath 'test-results/r02-input-factor.jsonl') { throw 'R02 evidence path already exists' }
      - name: Run isolated post-resize input-factor matrix
        env:
          JTT_R02_EVIDENCE_PATH: test-results/r02-input-factor.jsonl
        run: python -m pytest -q -s tests/test_windows_terminal_backend.py::test_r02_product_worker_post_resize_input_factor_diagnostic --junitxml=test-results/r02-input-factor.xml
