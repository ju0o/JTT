          if-no-files-found: ignore

  windows-ipc-integration:
    name: Windows Draft - IPC synthetic and native integration
    if: github.event.pull_request.draft == true
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize IPC evidence as inconclusive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          $evidence = [ordered]@{
            status = "INCONCLUSIVE"
            stage = "runner_entered"
            run_id = $env:GITHUB_RUN_ID
            commit_sha = $env:GITHUB_SHA
            runner_os = [System.Environment]::OSVersion.VersionString
            expected_source_root = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE "src"))
            configured_pythonpath = $env:PYTHONPATH
            expected_test_count = 46
            initialized_utc = [DateTimeOffset]::UtcNow.ToString("o")
          }
          [System.IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE "test-results/environment.json"), ($evidence | ConvertTo-Json -Depth 8), [System.Text.UTF8Encoding]::new($false))

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install isolated Windows IPC test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r experiments/windows_native/requirements.txt
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Verify Windows API and current checkout import identity
        id: ipc-preflight
        shell: pwsh
        run: |
          $preflight = @'
          import importlib.metadata as metadata
          import json
          import os
          import platform
          import sys
          from pathlib import Path

          report = Path("test-results/environment.json")
          evidence = json.loads(report.read_text(encoding="utf-8"))
          evidence["stage"] = "import_identity_started"
          report.write_text(json.dumps(evidence, indent=2, sort_keys=True), encoding="utf-8")
          try:
              import pywintypes
              import win32api
              import win32file
              import win32pipe
              import win32security

              import ju0_terminal_tower as jtt
              import tmux_agent_tower as legacy_alias
              import tmux_agent_tower.terminal.windows_ipc as ipc
              import tmux_agent_tower.terminal.windows_manager as manager

              expected = (Path(os.environ["GITHUB_WORKSPACE"]) / "src").resolve(strict=True)
              configured = Path(os.environ["PYTHONPATH"]).resolve(strict=True)
              jtt_path = Path(jtt.__file__).resolve(strict=True)
              legacy_path = Path(legacy_alias.__file__).resolve(strict=True)
              if configured != expected:
                  raise AssertionError("PYTHONPATH is not the current checkout src directory")
              if jtt_path != legacy_path:
                  raise AssertionError("JTT namespace and legacy alias do not share a source file")
              jtt_path.relative_to(expected)
              imports = {
                  "windows_ipc": str(Path(ipc.__file__).resolve(strict=True)),
                  "windows_manager": str(Path(manager.__file__).resolve(strict=True)),
              }
              for module_path in imports.values():
                  Path(module_path).relative_to(expected)
              data = {
                  "status": "IMPORT_READY",
                  "stage": "import_identity_verified",
                  "python": sys.version,
                  "platform": platform.platform(),
                  "pywin32": metadata.version("pywin32"),
                  "pywinpty": metadata.version("pywinpty"),
                  "pytest": metadata.version("pytest"),
                  "pyte": metadata.version("pyte"),
                  "jtt_distribution": metadata.version("ju0-terminal-tower"),
                  "source_root": str(expected),
                  "pythonpath": str(configured),
                  "jtt_namespace_path": str(jtt_path),
                  "legacy_alias_path": str(legacy_path),
                  "alias_same_source_file": True,
                  "imports": imports,
                  "native_api_modules": [win32api.__name__, win32file.__name__, win32pipe.__name__, win32security.__name__, pywintypes.__name__],
                  "expected_test_count": 46,
              }
          except Exception as exc:
              evidence.update({
                  "status": "INCONCLUSIVE",
                  "stage": "import_identity_failed",
                  "error_category": type(exc).__name__,
              })
              report.write_text(json.dumps(evidence, indent=2, sort_keys=True), encoding="utf-8")
              raise
          report.write_text(json.dumps(data, indent=2, sort_keys=True), encoding="utf-8")
          print(json.dumps(data, sort_keys=True))
          '@
          $preflightPath = Join-Path $env:RUNNER_TEMP "jtt-ipc-integration-preflight.py"
          [System.IO.File]::WriteAllText($preflightPath, $preflight, [System.Text.UTF8Encoding]::new($false))
          python $preflightPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect and require exactly 46 IPC test selectors
        id: ipc-collection
        shell: pwsh
        run: |
          $collectionOutput = & python -m pytest --noconftest -p no:cacheprovider --collect-only -q tests/test_windows_ipc.py 2>&1
          $collectionExit = $LASTEXITCODE
          $collectionText = ($collectionOutput | ForEach-Object { "$_" }) -join "`n"
          $collectionPath = Join-Path $env:GITHUB_WORKSPACE "test-results/collection.log"
          [System.IO.File]::WriteAllText($collectionPath, $collectionText, [System.Text.UTF8Encoding]::new($false))
          $nodeIds = @($collectionText -split "`r?`n" | Where-Object { $_ -match '^tests/test_windows_ipc\.py::' })
          $uniqueNodeIds = @($nodeIds | Select-Object -Unique)
          $evidencePath = Join-Path $env:GITHUB_WORKSPACE "test-results/environment.json"
          $evidence = Get-Content -Raw $evidencePath | ConvertFrom-Json
          $evidence | Add-Member -NotePropertyName collection_exit_code -NotePropertyValue $collectionExit -Force
          $evidence | Add-Member -NotePropertyName collection_count -NotePropertyValue $nodeIds.Count -Force
          $evidence | Add-Member -NotePropertyName collection_unique_count -NotePropertyValue $uniqueNodeIds.Count -Force
          $evidence | Add-Member -NotePropertyName collection_node_ids -NotePropertyValue @($nodeIds) -Force
          $collectionReady = ($collectionExit -eq 0 -and $nodeIds.Count -eq 46 -and $uniqueNodeIds.Count -eq 46)
          $evidence | Add-Member -NotePropertyName status -NotePropertyValue $(if ($collectionReady) { "COLLECTION_READY" } else { "INCONCLUSIVE" }) -Force
          $evidence | Add-Member -NotePropertyName stage -NotePropertyValue $(if ($collectionReady) { "collection_verified" } else { "collection_failed" }) -Force
          [System.IO.File]::WriteAllText($evidencePath, ($evidence | ConvertTo-Json -Depth 8), [System.Text.UTF8Encoding]::new($false))
          Write-Output $collectionText
          if (-not $collectionReady) { throw "Expected 46 unique IPC test selectors; collected $($nodeIds.Count) with $($uniqueNodeIds.Count) unique (exit $collectionExit)" }

      - name: Run all IPC synthetic and native tests
        id: ipc-tests
        shell: pwsh
        run: |
          $evidencePath = Join-Path $env:GITHUB_WORKSPACE "test-results/environment.json"
          $evidence = Get-Content -Raw $evidencePath | ConvertFrom-Json
          if ($evidence.status -ne "COLLECTION_READY") { throw "IPC collection was not verified" }
          $evidence.status = "INCONCLUSIVE"
          $evidence.stage = "test_started"
          $evidence | Add-Member -NotePropertyName test_started_utc -NotePropertyValue ([DateTimeOffset]::UtcNow.ToString("o")) -Force
          [System.IO.File]::WriteAllText($evidencePath, ($evidence | ConvertTo-Json -Depth 8), [System.Text.UTF8Encoding]::new($false))
          & python -m pytest --noconftest -p no:cacheprovider -q -s tests/test_windows_ipc.py --junitxml=test-results/windows-ipc-integration.xml
          $pytestExit = $LASTEXITCODE
          $evidence = Get-Content -Raw $evidencePath | ConvertFrom-Json
          $evidence | Add-Member -NotePropertyName pytest_exit_code -NotePropertyValue $pytestExit -Force
          $evidence | Add-Member -NotePropertyName pytest_completed_utc -NotePropertyValue ([DateTimeOffset]::UtcNow.ToString("o")) -Force
          $evidence | Add-Member -NotePropertyName stage -NotePropertyValue "pytest_returned" -Force
          if ($pytestExit -ne 0) { $evidence | Add-Member -NotePropertyName status -NotePropertyValue "TEST_FAILED" -Force }
          [System.IO.File]::WriteAllText($evidencePath, ($evidence | ConvertTo-Json -Depth 8), [System.Text.UTF8Encoding]::new($false))
          if ($pytestExit -ne 0) { exit $pytestExit }

      - name: Require 46 executed tests with zero skips and finalize status
        if: always()
        shell: pwsh
        env:
          TEST_STEP_OUTCOME: ${{ steps.ipc-tests.outcome }}
        run: |
          $evidencePath = Join-Path $env:GITHUB_WORKSPACE "test-results/environment.json"
          if (-not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) { throw "IPC environment evidence is missing" }
          $evidence = Get-Content -Raw $evidencePath | ConvertFrom-Json
          $collectionPath = Join-Path $env:GITHUB_WORKSPACE "test-results/collection.log"
          $junitPath = Join-Path $env:GITHUB_WORKSPACE "test-results/windows-ipc-integration.xml"
          $status = "INCONCLUSIVE"
          $collectionEvidenceReady = ((Test-Path -LiteralPath $collectionPath -PathType Leaf) -and (Get-Item -LiteralPath $collectionPath).Length -gt 0 -and $evidence.collection_exit_code -eq 0 -and $evidence.collection_count -eq 46 -and $evidence.collection_unique_count -eq 46)
          $junitEvidenceReady = ((Test-Path -LiteralPath $junitPath -PathType Leaf) -and (Get-Item -LiteralPath $junitPath).Length -gt 0)
          if (-not $collectionEvidenceReady) {
            $evidence | Add-Member -NotePropertyName evidence_error_category -NotePropertyValue "CollectionEvidenceMissingOrInvalid" -Force
          }
          if ($junitEvidenceReady) {
            try {
              [xml]$junit = Get-Content -Raw $junitPath
              $cases = @($junit.SelectNodes("//testcase"))
              $failures = @($junit.SelectNodes("//testcase/failure")).Count
              $errors = @($junit.SelectNodes("//testcase/error")).Count
              $skips = @($junit.SelectNodes("//testcase/skipped")).Count
              $evidence | Add-Member -NotePropertyName junit_test_count -NotePropertyValue $cases.Count -Force
              $evidence | Add-Member -NotePropertyName junit_failure_count -NotePropertyValue $failures -Force
              $evidence | Add-Member -NotePropertyName junit_error_count -NotePropertyValue $errors -Force
              $evidence | Add-Member -NotePropertyName junit_skip_count -NotePropertyValue $skips -Force
              if ($cases.Count -eq 46 -and ($failures -gt 0 -or $errors -gt 0 -or $skips -gt 0)) {
                $status = "TEST_FAILED"
              } elseif ($collectionEvidenceReady -and $cases.Count -eq 46 -and $failures -eq 0 -and $errors -eq 0 -and $skips -eq 0 -and $env:TEST_STEP_OUTCOME -eq "success" -and $evidence.pytest_exit_code -eq 0) {
                $status = "TEST_PASSED"
              }
            } catch {
              $evidence | Add-Member -NotePropertyName junit_error_category -NotePropertyValue $_.Exception.GetType().Name -Force
            }
          } else {
            $evidence | Add-Member -NotePropertyName junit_error_category -NotePropertyValue "JunitEvidenceMissing" -Force
          }
          $evidence | Add-Member -NotePropertyName collection_evidence_verified -NotePropertyValue $collectionEvidenceReady -Force
          $evidence | Add-Member -NotePropertyName junit_evidence_verified -NotePropertyValue $junitEvidenceReady -Force
          $evidence | Add-Member -NotePropertyName status -NotePropertyValue $status -Force
          $evidence | Add-Member -NotePropertyName finalized_utc -NotePropertyValue ([DateTimeOffset]::UtcNow.ToString("o")) -Force
          [System.IO.File]::WriteAllText($evidencePath, ($evidence | ConvertTo-Json -Depth 8), [System.Text.UTF8Encoding]::new($false))
          if ($status -ne "TEST_PASSED") { throw "IPC integration status is $status; test outcome=$env:TEST_STEP_OUTCOME" }

      - name: Preserve IPC integration JUnit and environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ipc-integration-${{ github.run_id }}
          path: test-results/
          if-no-files-found: error

  candidate-gate:
    name: ${{ github.event.pull_request.draft && 'Windows draft validation (NOT RUN)' || 'Windows candidate verification status' }}
    if: always()
    needs: [conpty]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report Draft state without calling it a test pass
        if: github.event.pull_request.draft
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: python3 .github/scripts/ci_candidate_gate.py draft skipped "$PR_HEAD_SHA" "$CHECKOUT_SHA"

      - name: Require Windows feasibility for review candidates
        if: github.event.pull_request.draft == false
        env:
          TEST_RESULT: ${{ needs.conpty.result }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: python3 .github/scripts/ci_candidate_gate.py candidate "$TEST_RESULT" "$PR_HEAD_SHA" "$CHECKOUT_SHA"
