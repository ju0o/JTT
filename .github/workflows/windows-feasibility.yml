        run: python -m pytest -q -s tests/test_windows_terminal_backend.py::test_native_powershell_prompt_tracks_long_current_location tests/test_windows_terminal_backend.py::test_r02_startup_stage_diagnostic_separates_original_and_instrumented_copy --junitxml=test-results/r02-original-prompt.xml
      - name: Preserve R02 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
