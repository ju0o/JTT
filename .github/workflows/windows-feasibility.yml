name: Windows native feasibility
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  conpty:
    if: github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated feasibility dependencies
        run: python -m pip install -r experiments/windows_native/requirements.txt
      - name: Install JTT package for the platform-neutral CLI smoke
        run: python -m pip install --no-deps -e .
      - name: Confirm JTT version command avoids the POSIX terminal runtime
        run: jtt --version
      - name: Native ConPTY and Textual headless probe
        run: python -m pytest -q -s experiments/windows_native/test_probe.py
      - name: Native JTT Windows terminal backend
        run: python -m pytest -q -s tests/test_windows_terminal_backend.py
      - name: Windows client worker thread lifecycle
        run: python -m pytest -q tests/test_windows_worker_threads.py
      - name: Native JTT three-panel UI and PTY integration
        run: python -m pytest -q -s tests/test_windows_jtt_ui.py
      - name: Native Windows JTT workspace and layout persistence
        run: python -m pytest -q -s tests/test_windows_jtt_state.py

  windows-owned-stop:
    name: Windows Draft - Owned Stop, Job Object, identity
    if: github.event.pull_request.draft == true
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated test dependencies
        run: |
          python -m pip install -r experiments/windows_native/requirements.txt
          python -m pip install --no-deps -e .
      - name: Record Windows Python and dependency versions
        run: |
          python --version
          python -m pip freeze
          python -c "import platform; print(platform.platform())"
      - name: Prepare test-owned result directory
        run: New-Item -ItemType Directory -Force test-results | Out-Null
      - name: Run owned Stop, Job Object, and identity tests
        run: python -m pytest -q -s tests/test_windows_terminal_backend.py::test_native_shell_exit_remains_listed_until_explicit_owned_cleanup tests/test_windows_terminal_backend.py::test_native_stop_terminates_nested_children_in_the_owned_job tests/test_windows_terminal_backend.py::test_job_assignment_failure_terminates_only_retained_child_handle tests/test_windows_terminal_backend.py::test_process_access_denied_preserves_session_registry tests/test_windows_terminal_backend.py::test_process_image_query_race_fails_closed_unless_handle_is_signaled tests/test_windows_terminal_backend.py::test_process_facts_skips_image_query_for_reused_pid tests/test_windows_terminal_backend.py::test_stop_cleanup_requires_exact_final_generation_and_requested_exit tests/test_windows_terminal_backend.py::test_stop_cleanup_rejects_changed_shell_image_record tests/test_windows_terminal_backend.py::test_stop_cleanup_requires_confirmed_requested_exit --junitxml=test-results/owned-stop.xml
      - name: Preserve owned Stop result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-owned-stop-${{ github.run_id }}
          path: test-results/owned-stop.xml
          if-no-files-found: ignore

  windows-mutex-acl-probe:
    name: Windows Draft - Native Mutex ACL probe
    if: github.event.pull_request.draft == true
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated probe dependencies
        run: |
          python -m pip install -r experiments/windows_native/requirements.txt
          python -m pip install --no-deps -e .
      - name: Record Windows Python and platform
        run: |
          python --version
          python -c "import platform; print(platform.platform())"
      - name: Prepare test-owned result directory
        run: New-Item -ItemType Directory -Force test-results | Out-Null
      - name: Run test-owned native mutex ACL probe
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest --noconftest -p no:cacheprovider -q -s tests/test_windows_mutex_acl_policy.py::test_native_mutex_acl_probe_records_only_safe_fields --junitxml=test-results/mutex-acl-probe.xml
      - name: Preserve native mutex ACL result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-mutex-acl-probe-${{ github.run_id }}
          path: test-results/mutex-acl-probe.xml
          if-no-files-found: ignore

